<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Boats — Orcado Fish</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: #020d18;
  color: #fff;
}

/* ===== HERO BACKGROUND ===== */
.hero {
  min-height: 100vh;
  background:
    linear-gradient(rgba(2,13,24,.65), rgba(2,13,24,.9)),
    url("Background1.jpg") center/cover no-repeat;
}

/* ===== NAVBAR ===== */
nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 22px 48px;
  position: absolute;
  width: 100%;
  top: 0;
  z-index: 10;
}

.nav-left a {
  margin-right: 22px;
  text-decoration: none;
  color: #dfefff;
  font-size: 14px;
  letter-spacing: .08em;
}

.nav-left a:hover { opacity: .7; }

.nav-center {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-center img {
  width: 46px;
}

.nav-center span {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
}

/* ===== SECTION ===== */
section {
  padding: 140px 20px 80px;
  max-width: 1100px;
  margin: auto;
}

section h2 {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  margin-bottom: 26px;
}

/* ===== CARD ===== */
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,.15);
  padding: 24px;
  border-radius: 18px;
  backdrop-filter: blur(6px);
}

/* ===== CONTROLS ===== */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
}

.controls input {
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.08);
  color: #fff;
  width: 260px;
}

.controls input::placeholder {
  color: #bcd3f2;
}

.controls input:focus {
  outline: none;
  border-color: #2ecc71;
}

.controls button {
  padding: 10px 16px;
  border-radius: 10px;
  background: #2ecc71;
  border: none;
  color: #01210f;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.controls button:hover {
  background: #27ae60;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 14px;
  background: rgba(255,255,255,.04);
  border-radius: 12px;
  overflow: hidden;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,.12);
}

th {
  background: rgba(255,255,255,.08);
  font-weight: 600;
  color: #dfefff;
}

tr:hover {
  background: rgba(255,255,255,.05);
}

/* ===== STATUS ===== */
.status {
  padding: 4px 10px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 13px;
}

.active {
  background: rgba(46,204,113,.2);
  color: #2ecc71;
}

.expired {
  background: rgba(231,76,60,.2);
  color: #e74c3c;
}

/* ===== PAGINATION ===== */
.pagination {
  margin-top: 18px;
  text-align: center;
}

.pagination button {
  margin: 4px;
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,.12);
  border: none;
  color: #fff;
  cursor: pointer;
}

.pagination button:hover {
  background: rgba(255,255,255,.2);
}

/* ================= MOBILE FIX (MATCHES INDEX & ADD BOAT) ================= */
@media (max-width: 768px) {

  nav {
    position: fixed;
    background: rgba(2,13,24,.92);
    backdrop-filter: blur(6px);
    padding: 10px 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .nav-center {
    justify-content: center;
  }

  .nav-left {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
  }

  .nav-left a {
    margin: 0;
    font-size: 12px;
  }

  section {
    padding-top: 190px; /* prevents overlap with fixed navbar */
  }

  .controls input {
    width: 100%;
  }

  section h2 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<div class="hero">

  <!-- NAVBAR -->
  <nav>
    <div class="nav-left">
      <a href="index.html">ABOUT</a>
      <a href="add-boat.html">ADD BOAT</a>
      <a href="view-boats.html">VIEW BOAT</a>
      <a href="#">FAQS</a>
      <a href="contact.html">CONTACT</a>
    </div>

    <div class="nav-center">
      <img src="logo.png" alt="Orcado Fish Logo">
      <span>Orcado Fish</span>
    </div>

    <div class="nav-right"></div>
  </nav>

  <!-- CONTENT -->
  <section>
    <h2>Registered Boats</h2>

    <div class="card">

      <div class="controls">
        <input id="searchBox" placeholder="Search boat / owner / location">
        <button onclick="exportExcel()">Export to Excel</button>
      </div>

      <table id="boatTable">
        <thead>
          <tr>
            <th>Boat</th>
            <th>Owner</th>
            <th>Location</th>
            <th>Mobile</th>
            <th>Status</th>
            <th>Expiry</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="pagination" id="pager"></div>

    </div>
  </section>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase-config.js"></script>

<!-- XLSX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
let boats = [], page = 1, size = 7;

function subStatus(date) {
  const d = new Date(date), t = new Date();
  return d >= new Date(t.toDateString()) ? "Active" : "Expired";
}

database.ref("boats").on("value", snap => {
  boats = [];
  snap.forEach(c => boats.push(c.val()));
  render();
});

searchBox.addEventListener("keyup", () => {
  page = 1;
  render();
});

function render() {
  const q = searchBox.value.toLowerCase();
  const filtered = boats.filter(b =>
    (b.boatName || "").toLowerCase().includes(q) ||
    (b.ownerName || "").toLowerCase().includes(q) ||
    (b.location || "").toLowerCase().includes(q)
  );

  const start = (page - 1) * size;
  const pageData = filtered.slice(start, start + size);

  const body = document.querySelector("#boatTable tbody");
  body.innerHTML = "";

  pageData.forEach(b => {
    const s = subStatus(b.finishDate);
    body.innerHTML += `
      <tr>
        <td>${b.boatName}</td>
        <td>${b.ownerName}</td>
        <td>${b.location}</td>
        <td>${b.mobile}</td>
        <td><span class="status ${s === 'Active' ? 'active' : 'expired'}">${s}</span></td>
        <td>${b.finishDate}</td>
      </tr>`;
  });

  renderPager(filtered.length);
}

function renderPager(total) {
  const pages = Math.ceil(total / size);
  const p = document.getElementById("pager");
  p.innerHTML = "";
  for (let i = 1; i <= pages; i++) {
    p.innerHTML += `<button onclick="page=${i};render()">${i}</button>`;
  }
}

function exportExcel() {
  const wb = XLSX.utils.table_to_book(document.getElementById("boatTable"));
  XLSX.writeFile(wb, "boats_data.xlsx");
}
</script>

</body>
</html>
