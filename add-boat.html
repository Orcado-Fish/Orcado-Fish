<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Boat — Orcado Fish</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: #020d18;
  color: #fff;
}

/* ===== HERO BACKGROUND ===== */
.hero {
  min-height: 100vh;
  background:
    linear-gradient(rgba(2,13,24,.65), rgba(2,13,24,.9)),
    url("Background1.jpg") center/cover no-repeat;
}

/* ===== NAVBAR ===== */
nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 22px 48px;
  position: absolute;
  width: 100%;
  top: 0;
  z-index: 10;
}

.nav-left a {
  margin-right: 22px;
  text-decoration: none;
  color: #dfefff;
  font-size: 14px;
  letter-spacing: .08em;
}

.nav-left a:hover { opacity: .7; }

.nav-center {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-center img {
  width: 46px;
}

.nav-center span {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
}

.nav-right {}

/* ===== FORM SECTION ===== */
section {
  padding: 140px 20px 80px;
  max-width: 600px;
  margin: auto;
}

section h2 {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  margin-bottom: 28px;
}

/* ===== CARD ===== */
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,.15);
  padding: 26px;
  border-radius: 18px;
  backdrop-filter: blur(6px);
}

/* ===== FORM ===== */
label {
  display: block;
  margin-top: 14px;
  font-weight: 500;
  color: #cfe6ff;
}

input, select {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.25);
  font-size: 14px;
  background: rgba(255,255,255,.08);
  color: #fff;
}

input:focus, select:focus {
  outline: none;
  border-color: #2ecc71;
}

/* ===== BUTTON ===== */
button {
  width: 100%;
  margin-top: 22px;
  padding: 13px;
  border-radius: 12px;
  border: none;
  background: #2ecc71;
  color: #01210f;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #27ae60;
}

#status {
  margin-top: 14px;
  text-align: center;
  font-weight: 600;
}

/* ================= MOBILE FIX (MATCHES INDEX) ================= */
@media (max-width: 768px) {

  nav {
    position: fixed;
    background: rgba(2,13,24,.92);
    backdrop-filter: blur(6px);
    padding: 10px 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .nav-center {
    justify-content: center;
  }

  .nav-left {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
  }

  .nav-left a {
    margin: 0;
    font-size: 12px;
  }

  section {
    padding-top: 180px; /* prevents overlap with fixed navbar */
  }

  section h2 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<div class="hero">

  <!-- NAVBAR -->
  <nav>
    <div class="nav-left">
      <a href="index.html">ABOUT</a>
      <a href="add-boat.html">ADD BOAT</a>
      <a href="view-boats.html">VIEW BOAT</a>
      <a href="#">FAQS</a>
      <a href="contact.html">CONTACT</a>
    </div>

    <div class="nav-center">
      <img src="logo.png" alt="Orcado Fish Logo">
      <span>Orcado Fish</span>
    </div>

    <div class="nav-right"></div>
  </nav>

  <!-- FORM -->
  <section>
    <h2>Add Boat</h2>

    <div class="card">
      <form id="boatForm">

        <label>Boat Name</label>
        <input id="boatName" required>

        <label>Location</label>
        <input id="location" required>

        <label>Owner Name</label>
        <input id="ownerName" required>

        <label>Registration Number</label>
        <input id="registrationNumber" required>

        <label>Mobile</label>
        <input id="mobile" required>

        <label>Email</label>
        <input id="email" type="email" required>

        <label>Subscription Active</label>
        <select id="subscriptionActive" required>
          <option value="">Select</option>
          <option>Yes</option>
          <option>No</option>
        </select>

        <label>Finish Date</label>
        <input type="date" id="finishDate" required>

        <label>Wireless No</label>
        <input id="wirelessNo" required>

        <button type="submit">Save Boat</button>
        <p id="status"></p>

      </form>
    </div>
  </section>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase-config.js"></script>

<script>
boatForm.addEventListener("submit", function(e) {
  e.preventDefault();

  const b = {
    boatName: boatName.value.trim(),
    location: location.value.trim(),
    ownerName: ownerName.value.trim(),
    registrationNumber: registrationNumber.value.trim(),
    mobile: mobile.value.trim(),
    email: email.value.trim(),
    subscriptionActive: subscriptionActive.value,
    finishDate: finishDate.value,
    wirelessNo: wirelessNo.value.trim()
  };

  for (const k in b) {
    if (!b[k]) {
      status.style.color = "salmon";
      status.innerHTML = "Please fill all fields";
      return;
    }
  }

  database.ref("boats").push(b);

  status.style.color = "#2ecc71";
  status.innerHTML = "Boat saved successfully ✔️";
  this.reset();
});
</script>

</body>
</html>
