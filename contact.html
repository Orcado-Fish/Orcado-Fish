<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact – Orcado Fish</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: #020d18;
  color: #fff;
}

/* ===== HERO ===== */
.hero {
  height: 60vh;
  background:
    linear-gradient(rgba(2,13,24,.55), rgba(2,13,24,.85)),
    url("Background1.jpg") center/cover no-repeat;
  display: flex;
  flex-direction: column;
}

/* ===== NAVBAR ===== */
nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 22px 48px;
  position: absolute;
  width: 100%;
  top: 0;
}

.nav-left {
  display: flex;
  align-items: center;
}

.nav-left a {
  margin-right: 22px;
  text-decoration: none;
  color: #dfefff;
  font-size: 14px;
  letter-spacing: .08em;
}

.nav-left a:hover { opacity: .7; }

.nav-center {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
}

.nav-center img { width: 46px; }

.nav-center span {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
}

.nav-right {}

/* ===== HERO TEXT ===== */
.hero-content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero-content h1 {
  font-family: 'Playfair Display', serif;
  font-size: 52px;
}

.hero-content p {
  margin-top: 10px;
  color: #2ecc71;
}

/* ===== CONTACT DETAILS ===== */
.contact-details {
  background: #fff;
  color: #020d18;
  padding: 90px 40px;
}

.contact-grid {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: 2fr 2.5fr 1.5fr 1fr;
  gap: 70px;
}

/* BRAND */
.brand-box {
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand-logo {
  font-family: 'Playfair Display', serif;
  font-size: 64px;
}

.brand-text {
  font-size: 18px;
  line-height: 1.2;
}

/* COLUMNS */
.contact-col h3 {
  color: #2ecc71;
  font-weight: 500;
  margin-bottom: 22px;
}

.contact-col p {
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 20px;
}

.contact-col a {
  display: block;
  text-decoration: none;
  color: #020d18;
  font-size: 14px;
  margin-bottom: 12px;
}

.contact-col a:hover {
  color: #2ecc71;
}

/* ===== FOOTER ===== */
footer {
  text-align: center;
  padding: 40px;
  background: #010912;
  opacity: .7;
}

/* ================= MOBILE FIX (SAME AS INDEX) ================= */
@media(max-width:900px){

  nav {
    grid-template-columns: 1fr;
    gap: 14px;
    padding: 16px 20px;
    text-align: center;
    position: relative;
  }

  .nav-center {
    order: 1;
    justify-content: center;
  }

  .nav-left {
    order: 2;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
  }

  .nav-left a {
    margin: 0;
    font-size: 13px;
  }

  .hero-content h1 {
    font-size: 36px;
  }

  .contact-grid {
    grid-template-columns: 1fr;
    gap: 40px;
    text-align: center;
  }

  .brand-box {
    justify-content: center;
  }
}
</style>
</head>

<body>

<div class="hero">

  <!-- NAVBAR -->
  <nav>
    <div class="nav-left">
      <a href="index.html">ABOUT</a>
      <a href="add-boat.html">ADD BOAT</a>
      <a href="view-boats.html">VIEW BOAT</a>
      <a href="#">FAQS</a>
      <a href="contact.html">CONTACT</a>
    </div>

    <div class="nav-center">
      <img src="logo.png" alt="Orcado Fish Logo">
      <span>Orcado Fish</span>
    </div>

    <div class="nav-right"></div>
  </nav>

  <!-- HERO CONTENT -->
  <div class="hero-content">
    <div>
      <h1>CONTACT US</h1>
      <p>Get in Touch</p>
    </div>
  </div>

</div>

<!-- CONTACT DETAILS -->
<section class="contact-details">
  <div class="contact-grid">

    <div class="brand-box">
      <div class="brand-logo">OFG</div>
      <div class="brand-text">
        Orcado Fish<br>
        Group
      </div>
    </div>

    <div class="contact-col">
      <h3>Get in Touch</h3>
      <p>
        <strong>Oomkar Koli</strong><br>
        Owner<br>
        7039793355<br>
        oomkar@orcado.fish<br>
        Location : Uran
      </p>
    </div>

    <div class="contact-col">
      <h3>Quick Links</h3>
      <a href="index.html">ABOUT</a>
      <a href="add-boat.html">ADD BOAT</a>
      <a href="view-boats.html">VIEW BOAT</a>
      <a href="#">FAQS</a>
      <a href="contact.html">CONTACT</a>
    </div>

    <div class="contact-col">
      <h3>Socials</h3>
      <a href="#">Facebook</a>
      <a href="#">Instagram</a>
      <a href="#">LinkedIn</a>
    </div>

  </div>
</section>

<footer>©2026 Orcado Fish</footer>

</body>
</html>
